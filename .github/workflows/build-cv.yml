name: Build CV

on:
  push:
    branches: [master]
    paths: [README.md, cv-print.css, build-html.js]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install -g md-to-pdf marked

      - name: Generate PDF
        run: md-to-pdf README.md --stylesheet cv-print.css --launch-options '{"args": ["--no-sandbox"]}' && mv README.pdf Jon_Vallet_CV.pdf

      - name: Generate DOCX
        run: pandoc -f markdown -t docx README.md -o Jon_Vallet.docx

      - name: Generate HTML
        run: node build-html.js

      - name: Commit index.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "build(CV): regenerate index.html"
          git push

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create cv-latest \
            --title "CV $(date +%Y-%m-%d)" \
            --notes "Auto-generated from README.md" \
            --target "${{ github.sha }}" \
            2>/dev/null || true
          gh release upload cv-latest Jon_Vallet_CV.pdf Jon_Vallet.docx --clobber
